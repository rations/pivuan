# Freedesktop icon name -> Haiku source icon, one table per theme context.
#
# Sources:
#   artwork:<Name>   data/artwork/icons/<Name> (Icon-O-Matic files)
#   rdef:<Name>      an icon in an app/preferences/server .rdef (see build/src/manifest.json)
#   mime:<type>      an icon from Haiku's MIME database (src/data/mime_db)
#
# The first name that uses a source becomes the real file; later names using the
# same source become symlinks to it. Every MIME database icon is also added to
# "mimetypes" under its freedesktop name (text/plain -> text-plain, the "image"
# supertype -> image-x-generic) unless it is Haiku-only (x-vnd.*); names given
# here take precedence. Run `make coverage` to see what is still missing.

