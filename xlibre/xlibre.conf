# XLibre for Pivuan: sources pinned to exact commits (build-xlibre.sh, .github/workflows/xlibre.yml).
#
# The source is X11Libre's own release tag; the Debian packaging (debian/) is xlibre-debian's,
# which build-xlibre.sh adapts to build against Devuan excalibur alone, without backports.
# To update: change the tag, its commit (git ls-remote <source> 'refs/tags/<tag>^{}', or the
# tag itself for a lightweight tag), the packaging commit and the version, then run the
# "XLibre for Pivuan" workflow.
#
# When security fixes are on a release branch but not tagged yet, the tag column can name the
# branch (release/25.2) and the commit one on it; the version is then the last tag's plus
# +git<date>.<short commit> (sorts after that tag, before the next one). Fixes not on the branch
# at all go in patches/<name>/ (build-xlibre.sh). Go back to a tag once one has the fixes, and
# drop the patches it contains.
#
# 2026-10-24: xserver follows release/25.2 at 1ed8aca (23 Oct): 126 commits after 25.2.2, with
# the fixes for CVE-2026-88812, -93515 to -93524; patches/xserver/ adds CVE-2026-93536.
# libinput is the same tag, rebuilt against that server (and published with it): +pivuan2.
#
# name      source                                      tag                                     commit                                    packaging                                            packaging-commit                          version
xserver     https://github.com/X11Libre/xserver         release/25.2                            1ed8acae8816deea9a72e2db9bf7b94f1beeb44b  https://github.com/xlibre-debian/xlibre-server      fe3eb03bbfe3a3b572b61587709894372777c1cd  2:25.2.2+git20261023.1ed8aca-1+pivuan1
libinput    https://github.com/X11Libre/xf86-input-libinput  xlibre-xf86-input-libinput-25.0.1  4eb6691efeef4969a05b1d6b77d980943fb9760e  https://github.com/xlibre-debian/xserver-xlibre-input-libinput  a5cdb753ab6ae8c7e626664d31d5643c641bbb49  1:25.0.1-1+pivuan2
