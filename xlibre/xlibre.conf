# XLibre for Pivuan: sources pinned to exact commits (build-xlibre.sh, .github/workflows/xlibre.yml).
#
# The source is X11Libre's own release tag; the Debian packaging (debian/) is xlibre-debian's,
# which build-xlibre.sh adapts to build against Devuan excalibur alone, without backports.
# To update: change the tag, its commit (git ls-remote <source> 'refs/tags/<tag>^{}', or the
# tag itself for a lightweight tag), the packaging commit and the version, then run the
# "XLibre for Pivuan" workflow.
