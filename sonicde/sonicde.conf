# SonicDE for Pivuan: the whole stack (Qt, SonicDE's frameworks and desktop) built into
# /opt/sonicde, apart from Devuan's Qt 6.8 and KDE in /usr. SonicDE needs Qt >= 6.11 and its own
# frameworks (>= 6.30); excalibur has Qt 6.8.2 and KF6 6.13.
#
# Built on the PC in an excalibur arm64 root through qemu (make-root.sh, enter-root.sh), never in
# GitHub Actions; published to the rations/sonicde apt repository.
#
# qt          Qt release; the module tarballs are pinned in qt.sha256 (download.qt.io lists only
#             MD5 sums, so the SHA-256s were taken on first download)
# builder     Sonic-DE/sonicde-builder commit: which repos there are, their order and CMake options
# core, frameworks, system
#             SonicDE release series: each repo in the builder's version-repos-{plasma,frameworks,
#             system}.list is built from its newest tag in that series (6.8.0 takes 6.8.0.2);
#             repos in none of the lists are built from the builder's ref (usually master).
#             plan-sonicde.py writes the commits to sonicde.lock.
# extra       name, git URL, tag, CMake options: a library Devuan has but links to its Qt 6.8,
#             rebuilt against /opt/sonicde (two Qt versions in one process crash), or has too old
# skip        a repo of the builder's solution that Pivuan leaves out, and why
# cmake       repo, CMake options added to the builder's for it (/src/sonicde is this directory
#             in the build root)
# os          Devuan packages the build needs that the builder does not list
# revision    Pivuan revision, the -pivuan<n> of every package version
#
# name    value
qt        6.11.2
builder   5b5ace8826a74ac18b145cd3dd695e55dc5b5dfb
core        6.8.0
frameworks  6.31.0
system      26.08

extra  qtkeychain  https://github.com/frankosterfeld/qtkeychain.git  0.17.0  -DBUILD_WITH_QT6=ON
extra  kdsoap  https://github.com/KDAB/KDSoap.git  kdsoap-2.3.0  -DKDSoap_QT6=ON -DKDSoap_DOCS=OFF -DKDSoap_EXAMPLES=OFF -DKDSoap_TESTS=OFF
extra  kdsoap-ws-discovery-client  https://invent.kde.org/libraries/kdsoap-ws-discovery-client.git  v0.4.0  -DQT_MAJOR_VERSION=6 -DBUILD_QCH=OFF
# sonic-quick-image-editor needs Highway >= 1.3.0 (excalibur: 1.2.0). Static, so Devuan's libhwy1t64
# (libjxl, libavif) is the only libhwy.so loaded
extra  highway  https://github.com/google/highway.git  1.3.0  -DBUILD_SHARED_LIBS=OFF -DHWY_ENABLE_TESTS=OFF -DHWY_ENABLE_EXAMPLES=OFF -DHWY_ENABLE_CONTRIB=OFF

skip  sonic-pyside                 # only for the frameworks' Python bindings (off); needs clang
skip  sonic-mobile-interface       # phone shell
skip  sonic-tv-interface           # TV shell
skip  sonic-partition-manager      # needs Devuan's kpmcore (Qt 6.8)
skip  sonic-breeze-sddm            # SDDM theme: Pivuan logs in with LightDM
skip  sonic-login-manager          # SDDM settings
skip  sonic-thunderbolt            # the Pi has no Thunderbolt
skip  sonic-drawing-tablet       # needs the Xorg wacom driver; Pivuan has no XLibre build of it
skip  sonic-firewall               # needs firewalld or ufw
skip  sonic-dr-robotnik            # crash reporter: needs python3-pygdbmi, not in excalibur
skip  sonic-theme-sdk              # theme developer tool
skip  sonic-l10n-templates         # translation templates, nothing to build
skip  sonic-accounts-integration   # online accounts (with the two below): needs signond and Qt 5
skip  sonic-frameworks-sso
skip  sonic-qt-accounts-library
skip  sonic-oxygen                 # old Oxygen theme, icons and sounds (Silver is the default)
skip  sonic-oxygen-icons
skip  sonic-oxygen-sounds

cmake  sonic-workspace-addons  -DCMAKE_PROJECT_INCLUDE=/src/sonicde/cmake/qt-shadertools.cmake

# From SonicDE's Debian packaging and the repos' CMake files
os  libcap-dev libcrypt-dev libdisplay-info-dev libibus-1.0-dev liblcms2-dev libopengl-dev
os  libpam0g-dev libqalculate-dev libusb-1.0-0-dev libxcursor-dev libxft-dev libxkbregistry-dev
os  libxtst-dev libxcvt-dev libxss-dev libxkbfile-dev
os  libpci-dev libhunspell-dev libxml2-dev libxml2-utils liblmdb-dev libtag-dev libattr1-dev
os  libacl1-dev libbz2-dev libqrencode-dev libsmbclient-dev libssh-dev libtirpc-dev libmtp-dev
os  libavif-dev libheif-dev libjxl-dev libraw-dev libopenexr-dev libopenjp2-7-dev
os  libpwquality-dev libblkid-dev docbook-xml docbook-xsl liburi-perl libfuse3-dev fuse3 gsettings-desktop-schemas libgtk-3-dev
# Header files only, for the mouse and touchpad settings (X input property names, the same in
# XLibre); the build root only, nothing of Xorg goes to the Pi
os  xserver-xorg-dev xserver-xorg-input-libinput-dev
# xdg-desktop-portal-sonicde (for Flatpak apps, and screen sharing once a user installs PipeWire)
os  libei-dev libeis-dev

revision  1
