# Build Screenshot for Pivuan Audio (pivuan-screenshot, screenshot/) and, with "publish", add it
# to the Pivuan apt repository (this repository's gh-pages branch).
#
# The package is one Python program, for all architectures, so it is built on an ordinary
# runner. It is then checked in a clean Debian trixie container (the same libraries as Devuan
# excalibur): its dependencies bring GTK 3 for Python and scrot, Print's command saves a picture
# of a virtual screen (Xvfb) in ~/Pictures, and its window (never shown) goes through its pages
# with a made-up shot.
#
# The apt repository scripts are shared with the image build: they are read from rations/build
# (branch pivuan, .github/pivuan/).
#
# Publishing needs the secret PIVUAN_APT_SIGNING_KEY in this repository (the same key as in
# rations/build). The push to gh-pages uses this workflow's own token.

name: Pivuan Screenshot

# Started by hand only, to save Actions minutes: no push, pull request or schedule triggers.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the package to the Pivuan apt repository"
        type: boolean
        default: false
      build_ref:
        description: "rations/build branch with the shared scripts"
        type: string
        default: pivuan

permissions:
  contents: read

concurrency:
  group: pivuan-screenshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: pivuan-screenshot
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.deb.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends make dpkg-dev python3

      - name: Build the package
        id: deb
        run: |
          set -euo pipefail
          make -C screenshot deb
          mkdir -p "${RUNNER_TEMP}/out"
          cp screenshot/build/*.deb "${RUNNER_TEMP}/out/"
          deb="$(ls "${RUNNER_TEMP}"/out/*.deb)"
          echo "version=$(dpkg-deb -f "${deb}" Version)" >> "${GITHUB_OUTPUT}"

      - name: Install and check in a clean root
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/out"
          # Exactly one package: pivuan-screenshot, for all architectures
          debs=(*.deb)
          [[ "${#debs[@]}" == 1 ]] || { echo "::error::expected one package, found ${#debs[@]}"; exit 1; }
          pkg="$(dpkg-deb -f "${debs[0]}" Package)"
          arch="$(dpkg-deb -f "${debs[0]}" Architecture)"
          [[ "${pkg}:${arch}" == pivuan-screenshot:all ]] \
            || { echo "::error::${debs[0]}: ${pkg} (${arch}) is not pivuan-screenshot (all)"; exit 1; }
          # No path of the build machine in the package
          mkdir root && dpkg-deb -R "${debs[0]}" root
          if grep -rlI -e "${HOME}" -e "${GITHUB_WORKSPACE}" root; then
            echo "::error::the package names paths of the build machine"; exit 1
          fi
          cp "${GITHUB_WORKSPACE}/screenshot/test-window.py" .
          docker run --rm -v "${PWD}:/debs" debian:trixie bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            # The package brings GTK 3 for Python and scrot; the icons and Xvfb are for the checks
            apt-get install -y -q --no-install-recommends "/debs/'"${debs[0]}"'" \
              adwaita-icon-theme xvfb xauth file
            useradd -m tester
            # Wrong arguments: the usage, exit 2
            if su tester -c "pivuan-screenshot nonsense"; then exit 1; fi
            # Print: the whole virtual screen, saved in ~/Pictures (made if it is missing)
            su tester -c "xvfb-run -a -s \"-screen 0 1024x600x24\" pivuan-screenshot screen"
            ls -l /home/tester/Pictures
            file /home/tester/Pictures/screenshot_*.png | tee /tmp/shot.log
            grep -q "PNG image data, 1024 x 600" /tmp/shot.log
            # The window, on a virtual screen (never shown)
            su tester -c "xvfb-run -a python3 /debs/test-window.py /usr/bin/pivuan-screenshot"
          '
          echo "${debs[0]}: $(dpkg-deb -f "${debs[0]}" Installed-Size) KiB installed" >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-deb
          path: ${{ runner.temp }}/out/*.deb
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Shared scripts from rations/build
        uses: actions/checkout@v4
        with:
          repository: rations/build
          ref: ${{ inputs.build_ref || 'pivuan' }}
          path: build-scripts
          sparse-checkout: .github/pivuan

      - uses: actions/download-artifact@v4
        with:
          name: screenshot-deb
          path: debs

      - name: Publish to the Pivuan apt repository
        env:
          SIGNING_KEY: ${{ secrets.PIVUAN_APT_SIGNING_KEY }}
          REPO_TOKEN: ${{ github.token }}
          PIVUAN_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_KEY}" ]] || { echo "::error::publishing needs the PIVUAN_APT_SIGNING_KEY secret in this repository"; exit 1; }
          command -v apt-ftparchive > /dev/null || sudo apt-get install -y -q apt-utils
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          gpg --batch --quiet --import <<< "${SIGNING_KEY}"
          PIVUAN_APT_SIGNING_KEY_ID="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          [[ -n "${PIVUAN_APT_SIGNING_KEY_ID}" ]] || { echo "::error::PIVUAN_APT_SIGNING_KEY holds no private key"; exit 1; }
          export PIVUAN_APT_SIGNING_KEY_ID PIVUAN_APT_ACCEPT_ALL=1 PIVUAN_PAGES_LIST="${RUNNER_TEMP}/published.txt"
          bash build-scripts/.github/pivuan/publish-pages.sh "screenshot-${VERSION}" debs
          {
            echo "## Apt repository"
            echo ""
            echo "pivuan-screenshot ${VERSION}"
            echo ""
            echo '```'
            cat "${PIVUAN_PAGES_LIST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
