# Build Desktop Settings for Pivuan Audio (pivuan-desktop-settings, desktop-settings/) and, with
# "publish", add it to the Pivuan apt repository (this repository's gh-pages branch).
#
# The package is one Python program, for all architectures, so it is built on an ordinary
# runner. It is then checked in a clean Debian trixie container (the same libraries as Devuan
# excalibur): its dependencies bring GTK 3 for Python, it reads settings and makes the panel's
# icons without a display, and its window (never shown, on Xvfb) highlights Apply only while
# something is to be applied.
#
# The apt repository scripts are shared with the image build: they are read from rations/build
# (branch pivuan, .github/pivuan/).
#
# Publishing needs the secret PIVUAN_APT_SIGNING_KEY in this repository (the same key as in
# rations/build). The push to gh-pages uses this workflow's own token.

name: Pivuan Desktop Settings

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the package to the Pivuan apt repository"
        type: boolean
        default: false
      build_ref:
        description: "rations/build branch with the shared scripts"
        type: string
        default: pivuan
  # A push that changes the program builds and checks it (never publishes).
  push:
    branches: [master]
    paths:
      - "desktop-settings/**"
      - ".github/workflows/desktop-settings.yml"

permissions:
  contents: read

concurrency:
  group: pivuan-desktop-settings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: pivuan-desktop-settings
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.deb.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends make dpkg-dev python3

      - name: Build the package
        id: deb
        run: |
          set -euo pipefail
          make -C desktop-settings deb
          mkdir -p "${RUNNER_TEMP}/out"
          cp desktop-settings/build/*.deb "${RUNNER_TEMP}/out/"
          deb="$(ls "${RUNNER_TEMP}"/out/*.deb)"
          echo "version=$(dpkg-deb -f "${deb}" Version)" >> "${GITHUB_OUTPUT}"

      - name: Install and check in a clean root
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/out"
          # Exactly one package: pivuan-desktop-settings, for all architectures
          debs=(*.deb)
          [[ "${#debs[@]}" == 1 ]] || { echo "::error::expected one package, found ${#debs[@]}"; exit 1; }
          pkg="$(dpkg-deb -f "${debs[0]}" Package)"
          arch="$(dpkg-deb -f "${debs[0]}" Architecture)"
          [[ "${pkg}:${arch}" == pivuan-desktop-settings:all ]] \
            || { echo "::error::${debs[0]}: ${pkg} (${arch}) is not pivuan-desktop-settings (all)"; exit 1; }
          # No path of the build machine in the package
          mkdir root && dpkg-deb -R "${debs[0]}" root
          if grep -rlI -e "${HOME}" -e "${GITHUB_WORKSPACE}" root; then
            echo "::error::the package names paths of the build machine"; exit 1
          fi
          cp "${GITHUB_WORKSPACE}/desktop-settings/test-window.py" .
          docker run --rm -v "${PWD}:/debs" debian:trixie bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            # The package brings GTK 3 for Python; the icons and Xvfb are for the checks
            apt-get install -y -q --no-install-recommends "/debs/'"${debs[0]}"'" \
              adwaita-icon-theme xvfb xauth
            useradd -m tester
            # Without settings: the defaults
            su tester -c "pivuan-desktop-settings --check" | tee /tmp/check.log
            grep -qx "background: /usr/share/backgrounds/pivuan/background-black.png" /tmp/check.log
            grep -qx "panel color: #959597" /tmp/check.log
            # The panel icons, made without a display: panel size - 8 (JWM draws them so)
            su tester -c "pivuan-desktop-settings --render-icons" | tee /tmp/icons.log
            grep -q "/panel-icons/audio-speakers.png 22x22$" /tmp/icons.log
            # The window, on a virtual screen (never shown)
            su tester -c "xvfb-run -a python3 /debs/test-window.py /usr/bin/pivuan-desktop-settings"
          '
          echo "${debs[0]}: $(dpkg-deb -f "${debs[0]}" Installed-Size) KiB installed" >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-settings-deb
          path: ${{ runner.temp }}/out/*.deb
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Shared scripts from rations/build
        uses: actions/checkout@v4
        with:
          repository: rations/build
          ref: ${{ inputs.build_ref || 'pivuan' }}
          path: build-scripts
          sparse-checkout: .github/pivuan

      - uses: actions/download-artifact@v4
        with:
          name: desktop-settings-deb
          path: debs

      - name: Publish to the Pivuan apt repository
        env:
          SIGNING_KEY: ${{ secrets.PIVUAN_APT_SIGNING_KEY }}
          REPO_TOKEN: ${{ github.token }}
          PIVUAN_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_KEY}" ]] || { echo "::error::publishing needs the PIVUAN_APT_SIGNING_KEY secret in this repository"; exit 1; }
          command -v apt-ftparchive > /dev/null || sudo apt-get install -y -q apt-utils
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          gpg --batch --quiet --import <<< "${SIGNING_KEY}"
          PIVUAN_APT_SIGNING_KEY_ID="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          [[ -n "${PIVUAN_APT_SIGNING_KEY_ID}" ]] || { echo "::error::PIVUAN_APT_SIGNING_KEY holds no private key"; exit 1; }
          export PIVUAN_APT_SIGNING_KEY_ID PIVUAN_APT_ACCEPT_ALL=1 PIVUAN_PAGES_LIST="${RUNNER_TEMP}/published.txt"
          bash build-scripts/.github/pivuan/publish-pages.sh "desktop-settings-${VERSION}" debs
          {
            echo "## Apt repository"
            echo ""
            echo "pivuan-desktop-settings ${VERSION}"
            echo ""
            echo '```'
            cat "${PIVUAN_PAGES_LIST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
