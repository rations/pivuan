# Build vstbridge and its Wine (wine-fex, wine-fex-i386, wine-fex-mono, vstbridge) for Pivuan and,
# with "publish", add them to the Pivuan apt repository (this repository's gh-pages branch).
#
# The build is rations/vstbridge's own "aarch64 build" workflow (.github/workflows/aarch64.yml on
# its arm64 branch), called here as a reusable workflow: it builds Wine with FEX and vstbridge on
# GitHub's arm64 runner, packages them, and installs and runs the packages in a clean Debian
# trixie container. Because it runs as part of this workflow, the packages are an artifact of this
# run, and publishing them needs no release in rations/vstbridge and no token for it, as for
# XLibre. Its Wine and FEX builds are cached in this repository (the first run builds Wine, which
# takes a few hours).
#
# The apt repository scripts are shared with the image build: they are read from rations/build
# (branch pivuan, .github/pivuan/).
#
# Publishing needs the secret PIVUAN_APT_SIGNING_KEY in this repository (the same key as in
# rations/build). The push to gh-pages uses this workflow's own token.

name: vstbridge for Pivuan

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the packages to the Pivuan apt repository"
        type: boolean
        default: true
      build_ref:
        description: "rations/build branch with the shared scripts"
        type: string
        default: pivuan

permissions:
  contents: read

concurrency:
  group: pivuan-vstbridge
  cancel-in-progress: false

jobs:
  # The branch in `uses` can't be an input: it is the same as `ref`, so the workflow and the
  # code it builds come from the same branch.
  build:
    uses: rations/vstbridge/.github/workflows/aarch64.yml@arm64
    with:
      repository: rations/vstbridge
      ref: arm64

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Shared scripts from rations/build
        uses: actions/checkout@v4
        with:
          repository: rations/build
          ref: ${{ inputs.build_ref || 'pivuan' }}
          path: build-scripts
          sparse-checkout: .github/pivuan

      - uses: actions/download-artifact@v4
        with:
          name: pivuan-debs
          path: debs

      - name: Check the packages
        run: |
          set -euo pipefail
          cd debs
          # Exactly vstbridge's four packages, for arm64 (the Mono installer is for all)
          found=""
          for deb in *.deb; do
            pkg="$(dpkg-deb -f "${deb}" Package)"
            arch="$(dpkg-deb -f "${deb}" Architecture)"
            echo "${deb}: ${pkg} $(dpkg-deb -f "${deb}" Version) ${arch}"
            case "${pkg}:${arch}" in
              wine-fex:arm64 | wine-fex-i386:arm64 | wine-fex-mono:all | vstbridge:arm64) ;;
              *) echo "::error::${deb}: ${pkg} (${arch}) is not one of vstbridge's packages"; exit 1 ;;
            esac
            found+="${pkg}"$'\n'
          done
          [[ "$(sort -u <<< "${found%$'\n'}" | wc -l)" == 4 && "$(wc -l <<< "${found%$'\n'}")" == 4 ]] \
            || { echo "::error::expected wine-fex, wine-fex-i386, wine-fex-mono and vstbridge once each"; exit 1; }

      - name: Publish to the Pivuan apt repository
        env:
          SIGNING_KEY: ${{ secrets.PIVUAN_APT_SIGNING_KEY }}
          REPO_TOKEN: ${{ github.token }}
          PIVUAN_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_KEY}" ]] || { echo "::error::publishing needs the PIVUAN_APT_SIGNING_KEY secret in this repository"; exit 1; }
          command -v apt-ftparchive > /dev/null || sudo apt-get install -y -q apt-utils
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          gpg --batch --quiet --import <<< "${SIGNING_KEY}"
          PIVUAN_APT_SIGNING_KEY_ID="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          [[ -n "${PIVUAN_APT_SIGNING_KEY_ID}" ]] || { echo "::error::PIVUAN_APT_SIGNING_KEY holds no private key"; exit 1; }
          export PIVUAN_APT_SIGNING_KEY_ID PIVUAN_APT_ACCEPT_ALL=1 PIVUAN_PAGES_LIST="${RUNNER_TEMP}/published.txt"
          bash build-scripts/.github/pivuan/publish-pages.sh "vstbridge-${VERSION}" debs
          {
            echo "## Apt repository"
            echo ""
            echo "vstbridge ${VERSION}"
            echo ""
            echo '```'
            cat "${PIVUAN_PAGES_LIST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
