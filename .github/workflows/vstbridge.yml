# Add vstbridge and its Wine (wine-fex, wine-fex-i386, wine-fex-mono, vstbridge) to the Pivuan
# apt repository (this repository's gh-pages branch), from a release of rations/vstbridge.
#
# The packages are built, installed and checked by the "aarch64 build" workflow in
# rations/vstbridge, which makes a pre-release with them (tag aarch64-<version>-<commits>) when
# it is started with "release". This workflow downloads a release's packages, checks them against
# its SHA256SUMS and that they are exactly those four packages, and publishes them. Publishing
# here, like XLibre, means the push to gh-pages uses this workflow's own token and rations/vstbridge
# needs no token for this repository.
#
# The apt repository scripts are shared with the image build: they are read from rations/build
# (branch pivuan, .github/pivuan/).
#
# Publishing needs the secret PIVUAN_APT_SIGNING_KEY in this repository (the same key as in
# rations/build), which XLibre already uses.

name: vstbridge for Pivuan

on:
  workflow_dispatch:
    inputs:
      release:
        description: "rations/vstbridge release tag (empty: the newest aarch64 release)"
        type: string
        default: ""
      build_ref:
        description: "rations/build branch with the shared scripts"
        type: string
        default: pivuan

permissions:
  contents: read

concurrency:
  group: pivuan-vstbridge
  cancel-in-progress: false

env:
  VSTBRIDGE_REPO: rations/vstbridge

jobs:
  publish:
    name: Publish vstbridge
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Shared scripts from rations/build
        uses: actions/checkout@v4
        with:
          repository: rations/build
          ref: ${{ inputs.build_ref || 'pivuan' }}
          path: build-scripts
          sparse-checkout: .github/pivuan

      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          set -euo pipefail
          if [[ -z "${TAG}" ]]; then
            TAG="$(gh release list --repo "${VSTBRIDGE_REPO}" --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("aarch64-"))] | sort_by(.createdAt) | last | .tagName // empty')"
            [[ -n "${TAG}" ]] || { echo "::error::${VSTBRIDGE_REPO} has no aarch64 release"; exit 1; }
          fi
          echo "${VSTBRIDGE_REPO} ${TAG}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          mkdir debs
          gh release download "${TAG}" --repo "${VSTBRIDGE_REPO}" --dir debs --pattern '*.deb' --pattern SHA256SUMS

      - name: Check the packages
        run: |
          set -euo pipefail
          cd debs
          # Every .deb listed in SHA256SUMS is here and intact, and there are no others
          grep '\.deb$' SHA256SUMS | sha256sum --check --strict
          [[ "$(grep -c '\.deb$' SHA256SUMS)" == "$(find . -name '*.deb' | wc -l)" ]] \
            || { echo "::error::the release has .deb files that SHA256SUMS doesn't list"; exit 1; }
          rm SHA256SUMS
          # Exactly vstbridge's four packages, for arm64 (the Mono installer is for all)
          found=""
          for deb in *.deb; do
            pkg="$(dpkg-deb -f "${deb}" Package)"
            arch="$(dpkg-deb -f "${deb}" Architecture)"
            echo "${deb}: ${pkg} $(dpkg-deb -f "${deb}" Version) ${arch}"
            case "${pkg}:${arch}" in
              wine-fex:arm64 | wine-fex-i386:arm64 | wine-fex-mono:all | vstbridge:arm64) ;;
              *) echo "::error::${deb}: ${pkg} (${arch}) is not one of vstbridge's packages"; exit 1 ;;
            esac
            found+="${pkg}"$'\n'
          done
          [[ "$(sort -u <<< "${found%$'\n'}" | wc -l)" == 4 && "$(wc -l <<< "${found%$'\n'}")" == 4 ]] \
            || { echo "::error::expected wine-fex, wine-fex-i386, wine-fex-mono and vstbridge once each"; exit 1; }

      - name: Publish to the Pivuan apt repository
        env:
          SIGNING_KEY: ${{ secrets.PIVUAN_APT_SIGNING_KEY }}
          REPO_TOKEN: ${{ github.token }}
          PIVUAN_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_KEY}" ]] || { echo "::error::publishing needs the PIVUAN_APT_SIGNING_KEY secret in this repository"; exit 1; }
          command -v apt-ftparchive > /dev/null || sudo apt-get install -y -q apt-utils
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          gpg --batch --quiet --import <<< "${SIGNING_KEY}"
          PIVUAN_APT_SIGNING_KEY_ID="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          [[ -n "${PIVUAN_APT_SIGNING_KEY_ID}" ]] || { echo "::error::PIVUAN_APT_SIGNING_KEY holds no private key"; exit 1; }
          export PIVUAN_APT_SIGNING_KEY_ID PIVUAN_APT_ACCEPT_ALL=1 PIVUAN_PAGES_LIST="${RUNNER_TEMP}/published.txt"
          bash build-scripts/.github/pivuan/publish-pages.sh "vstbridge-${TAG}" debs
          {
            echo "## Apt repository"
            echo ""
            echo "From ${GITHUB_SERVER_URL}/${VSTBRIDGE_REPO}/releases/tag/${TAG}"
            echo ""
            echo '```'
            cat "${PIVUAN_PAGES_LIST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
