# Onboard for Pivuan: Devuan's onboard source at exactly this version, with patches/*.patch
# added (build-onboard.sh, .github/workflows/onboard.yml). The Pivuan version sorts above
# Devuan's, so apt installs it from the Pivuan repository in place of Devuan's.
#
# When Devuan ships a newer onboard (excalibur, -updates or -security), the build stops: set
# its version here, reset the Pivuan version to <it>+pivuan1, check that the patches still
# apply, then run the "Onboard for Pivuan" workflow. Otherwise Pivuan's package would hide it.
#
# devuan-version  pivuan-version
1.4.1-10          1.4.1-10+pivuan1
